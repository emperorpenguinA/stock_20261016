name: 株価データ更新

on:
  schedule:
    # 東証の引け後 (16:10 JST) と米国市場の引け後 (06:40 JST)
    - cron: "10 7 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "config/**", "scripts/**", ".github/workflows/update-data.yml"]

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # 株価を取得して docs/data/prices.json をコミットする
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 株価を取得
        run: python scripts/fetch_data.py
      # 業績データの取得に失敗しても、株価の更新と公開は続ける
      - name: 業績データを取得
        continue-on-error: true
        run: python scripts/fetch_fundamentals.py
      - name: データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/prices.json docs/data/fundamentals.json
          git diff --cached --quiet && exit 0
          git commit -m "株価データを更新 ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # 東証の全銘柄 + S&P 500 のスクリーニング用データを作る (リポジトリにはコミットしない)
  # 失敗しても公開は続け、その場合は前回作ったデータを使う
  screen:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      # 業績は1日に少しずつ取り直すため、前回までの取得結果を引き継ぐ
      - name: 業績のキャッシュを復元
        uses: actions/cache/restore@v4
        with:
          path: fund-cache
          key: fund-cache-${{ github.run_id }}
          restore-keys: fund-cache-
      - name: 銘柄一覧を取得
        run: python scripts/build_universe.py universe.json
      - name: 全銘柄の株価と業績を取得
        run: python scripts/screen_all.py universe.json screen-out/data fund-cache --fund-limit 450 --fund-minutes 30
      - name: 一覧データを作成
        run: node scripts/summarize_screen.js screen-out/data
      - name: 業績のキャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fund-cache
          key: fund-cache-${{ github.run_id }}
      - name: スクリーニング結果を保存
        uses: actions/cache/save@v4
        with:
          path: screen-out
          key: screen-out-${{ github.run_id }}

  # docs/ を GitHub Pages に公開する
  # (リポジトリの Settings → Pages → Source を「GitHub Actions」にしておく必要がある)
  deploy:
    needs: [update, screen]
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      # 最新のスクリーニング結果 (今回失敗していれば前回のもの) を docs/data/ に加える
      - name: スクリーニング結果を復元
        uses: actions/cache/restore@v4
        with:
          path: screen-out
          key: screen-out-${{ github.run_id }}
          restore-keys: screen-out-
      - name: スクリーニング結果を公開用フォルダに入れる
        run: |
          if [ -d screen-out/data ]; then cp -r screen-out/data/. docs/data/; ls docs/data | head; else echo "スクリーニング結果がまだありません"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      # Pages の API は一時的に 500 を返すことがある。ジョブの再実行では
      # 「github-pages」アーティファクトが重複して失敗するため、同じジョブ内で1回だけやり直す。
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
